server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${starchef.datasource.driver-class-name}
      url: jdbc:mysql://${starchef.datasource.host}:${starchef.datasource.port}/${starchef.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${starchef.datasource.username}
      password: ${starchef.datasource.password}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.starchef.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      starchef:
        mapper: debug
        service: info
        controller: info

starchef:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: starchef-admin
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: starchef-user
    user-ttl: 7200000
    user-token-name: authentication

  wechat:
    appid: ${starchef.wechat.appid}
    secret: ${starchef.wechat.secret}
    mchid: ${starchef.wechat.mchid}
    mchSerialNo: ${starchef.wechat.mchSerialNo}
    privateKeyFilePath: ${starchef.wechat.privateKeyFilePath}
    apiV3Key: ${starchef.wechat.apiV3Key}
    weChatPayCertFilePath: ${starchef.wechat.weChatPayCertFilePath}
    notifyUrl: ${starchef.wechat.notifyUrl}
    refundNotifyUrl: ${starchef.wechat.refundNotifyUrl}
